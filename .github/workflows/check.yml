name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified official tag 2026-10-22
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6; verified official tag 2026-10-22
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts
      - run: npm run check:licenses
      - run: npm run check
      - run: npm audit --audit-level=low --ignore-scripts
      - run: node scripts/check-release.mjs
      - run: python3 -m venv /tmp/depthwise-ci-browser
      - run: /tmp/depthwise-ci-browser/bin/pip install -r tests/requirements.txt
      - name: Built-site browser checks with production CSP
        shell: bash
        run: |
          npm run preview -- --port 4173 > /tmp/depthwise-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-deployment.mjs http://127.0.0.1:4173
          DEPTHWISE_URL=http://127.0.0.1:4173 CHROME_PATH=/usr/bin/google-chrome /tmp/depthwise-ci-browser/bin/python tests/security_browser.py
          DEPTHWISE_URL=http://127.0.0.1:4173 /tmp/depthwise-ci-browser/bin/python tests/editing_browser.py
          DEPTHWISE_URL=http://127.0.0.1:4173 /tmp/depthwise-ci-browser/bin/python tests/header_browser.py
          DEPTHWISE_URL=http://127.0.0.1:4173 /tmp/depthwise-ci-browser/bin/python tests/landing_browser.py
          DEPTHWISE_URL=http://127.0.0.1:4173 /tmp/depthwise-ci-browser/bin/python tests/session_browser.py
          DEPTHWISE_URL=http://127.0.0.1:4173 /tmp/depthwise-ci-browser/bin/python tests/browser.py
          DEPTHWISE_URL=http://127.0.0.1:4173 /tmp/depthwise-ci-browser/bin/python tests/oss_landing_browser.py
          DEPTHWISE_URL=http://127.0.0.1:4173 /tmp/depthwise-ci-browser/bin/python tests/drop_browser.py
